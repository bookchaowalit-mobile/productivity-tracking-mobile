name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # NativeScript 8: npm ci, eslint, tsc, vitest with a coverage gate, then the NativeScript
    # webpack bundle for Android (JS only). `ns build android/ios` needs the Android SDK / Xcode
    # and App_Resources/, which this repo does not have yet, so no native binary is built here.
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22"
      require-tests: true
      coverage-threshold: "94" # measured 94.21% lines over app/**/*.ts on 2026-10-22, rounded down
      build-command: npm run bundle:android
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
