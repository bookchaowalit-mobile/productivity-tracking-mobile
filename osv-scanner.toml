# OSV-Scanner exceptions. Each entry needs a written reason and an expiry (batch rule, 2026-10-22).

[[IgnoredVulns]]
id = "GHSA-vcc3-ghjq-m6fr"
ignoreUntil = 2027-01-22T00:00:00Z
reason = """decode-uri-component 0.2.2 (DoS on malformed percent-encoding), dev-only and transitive:
@nativescript/webpack 5.0.39 -> css 3.0.0 -> source-map-resolve 0.6.0 -> decode-uri-component.
The only fixed release (0.5.0) is ESM-only and source-map-resolve loads it with require(), so an npm
override would break it. source-map-resolve is only reached from css.stringify() with source maps;
@nativescript/webpack's css2json-loader only parses this repo's own app.css, so no untrusted input
reaches decodeUriComponent and nothing ships in the app bundle. Revisit when @nativescript/webpack
drops css@3 or source-map-resolve."""
